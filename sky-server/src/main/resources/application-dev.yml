spring:
  config:
    import: optional:file:./config/application-local.yml,optional:file:../config/application-local.yml
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${sky.datasource.username}
    password: ${sky.datasource.password}
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 10
      max-wait: 5000
      validation-query: SELECT 1
      test-while-idle: true
      connection-error-retry-attempts: 0
      break-after-acquire-failure: true
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 2s
sky:
  datasource:
    host: ${DB_HOST:127.0.0.1}
    port: ${DB_PORT:3306}
    database: ${DB_NAME:sky_take_out}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  alioss:
    endpoint: ${ALI_OSS_ENDPOINT:https://oss-cn-guangzhou.aliyuncs.com}
    region: cn-guangzhou
    url-ttl-seconds: 900
    access-key-id: ${ALI_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALI_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALI_OSS_BUCKET:lay-java}
  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
