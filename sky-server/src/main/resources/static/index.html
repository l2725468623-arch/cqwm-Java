<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#333333">
  <title>苍穹外卖 · 管理端</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23ffb600'/%3E%3Cpath d='M7 12h18M6 17h20M9 22h14' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <main id="login-view" class="login-page">
    <section class="login-card" aria-label="苍穹外卖管理端登录">
      <div class="login-image" role="img" aria-label="石板餐桌上的精致汤品"></div>
      <div class="login-panel">
        <img class="login-logo" src="/assets/sky-logo.png" alt="苍穹外卖 THE SKY TAKE-OUT" width="175" height="53">
        <form id="login-form" class="login-form">
          <label class="input-line">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
            <span class="sr-only">用户名</span>
            <input id="username" name="username" autocomplete="username" placeholder="请输入用户名" value="admin" maxlength="32" required>
          </label>
          <label class="input-line password-line">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
            <span class="sr-only">密码</span>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" maxlength="128" required>
            <button id="toggle-password" type="button" class="eye-button" aria-label="显示密码" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </label>
          <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
          <button id="login-submit" type="submit" class="login-button">登录</button>
        </form>
      </div>
    </section>
  </main>
  <div id="admin-view" class="admin-layout" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="/assets/sky-logo.png" alt="苍穹外卖" width="164" height="50"></div>
      <nav aria-label="主菜单">
        <a href="#/" class="nav-item" data-route="home"><span aria-hidden="true">▦</span>工作台</a>
        <a href="#/employee" class="nav-item" data-route="employee"><span aria-hidden="true">♙</span>员工管理</a>
      </nav>
      <p class="sidebar-caption">THE SKY TAKE-OUT</p>
    </aside>
    <div class="admin-main">
      <header class="topbar">
        <h1 id="page-title">工作台</h1>
        <div class="account-menu"><span class="avatar" aria-hidden="true">管</span><span id="account-name">管理员</span><span class="divider"></span><button id="logout-button" type="button">退出登录</button></div>
      </header>
      <main class="workspace">
        <p id="page-error" class="page-error" role="alert" hidden></p>
        <section id="dashboard-section">
          <div class="welcome"><div><p class="eyebrow">苍穹外卖管理后台</p><h2 id="welcome-name">欢迎回来</h2><p>认真对待每一餐，用心做好每一天。</p></div><time id="today-label"></time></div>
          <div class="metric-grid" aria-label="业务数据概览">
            <article class="metric"><span>员工总数</span><strong id="metric-employee">—</strong><span class="metric-foot">店内团队</span></article>
            <article class="metric"><span>分类总数</span><strong id="metric-category">—</strong><span class="metric-foot">菜品与套餐分类</span></article>
            <article class="metric"><span>菜品总数</span><strong id="metric-dish">—</strong><span class="metric-foot">餐厅菜品</span></article>
            <article class="metric"><span>订单总数</span><strong id="metric-order">—</strong><span class="metric-foot">全部订单</span></article>
          </div>
          <section class="surface account-surface"><div class="surface-heading"><h3>当前登录账号</h3><span class="status-tag">正常</span></div><dl class="profile-grid"><div><dt>姓名</dt><dd id="profile-name">—</dd></div><div><dt>用户名</dt><dd id="profile-username">—</dd></div><div><dt>手机号</dt><dd id="profile-phone">—</dd></div></dl><a class="text-link" href="#/employee">查看员工列表 <span aria-hidden="true">→</span></a></section>
        </section>
        <section id="employee-section" class="surface employee-surface" hidden>
          <div class="surface-heading"><h2>员工管理</h2><span class="muted">员工账号与状态</span></div>
          <form id="employee-search" class="search-bar"><label for="employee-name">员工姓名</label><input id="employee-name" maxlength="32" placeholder="请输入员工姓名"><button class="primary-button" type="submit">查询</button><button id="reset-search" class="secondary-button" type="button">重置</button></form>
          <div class="table-wrap"><table><thead><tr><th>姓名</th><th>用户名</th><th>手机号</th><th>账号状态</th><th>创建时间</th></tr></thead><tbody id="employee-rows"></tbody></table></div>
          <p id="employee-empty" class="empty-state" hidden>暂无符合条件的员工</p>
          <p id="employee-loading" class="empty-state" role="status" hidden>正在加载员工信息…</p>
          <div class="pagination"><span id="employee-total">共 0 条</span><button id="previous-page" class="secondary-button" type="button">上一页</button><span id="page-number">1</span><button id="next-page" class="secondary-button" type="button">下一页</button></div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
