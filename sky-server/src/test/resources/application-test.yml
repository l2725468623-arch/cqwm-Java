spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:sky_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    druid:
      initial-size: 1
      min-idle: 1
      validation-query: SELECT 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
sky:
  jwt:
    admin-secret-key: test-only-secret-for-isolated-h2-integration-tests
